name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --output-format=github: Lint-Verletzungen erscheinen direkt als
      # Annotations am PR/Commit statt nur im Job-Log.
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      # pytest schreibt bei Fehlschlag die wichtigsten Zeilen (Zusammenfassung,
      # Traceback-Details, Exceptions) als GitHub-Annotations, damit die
      # Ursache direkt im Checks-Tab sichtbar ist statt nur im Job-Log.
      - name: Tests (pytest)
        run: |
          status=0
          pytest -v --tb=short > pytest_output.txt 2>&1 || status=$?
          cat pytest_output.txt
          if [ $status -ne 0 ]; then
            echo "pytest fehlgeschlagen (Exit $status)."
            {
              grep -E "^(FAILED|ERROR|INTERNALERROR)" pytest_output.txt || true
              grep -E "^E " pytest_output.txt || true
              grep -E "(Error|Exception)[: ]" pytest_output.txt | head -10 || true
            } | head -25 | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
            exit 1
          fi
