name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --output-format=github: Lint-Verletzungen erscheinen direkt als
      # Annotations am PR/Commit statt nur im Job-Log.
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Tests (pytest)
        run: pytest -v
