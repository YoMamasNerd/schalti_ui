{% if SCHALTI_APPS_REGISTRY_URL %}
<div class="schalti-app-switcher" data-registry="{{ SCHALTI_APPS_REGISTRY_URL }}">
  <button type="button" class="schalti-app-switcher-trigger" aria-haspopup="true" aria-expanded="false" aria-label="App wechseln">
    <sl-icon name="grid-3x3-gap-fill"></sl-icon>
    <span class="schalti-app-switcher-label">Apps</span>
    <sl-icon name="chevron-down" style="font-size: 0.7rem;"></sl-icon>
  </button>
  <div class="schalti-app-switcher-panel" role="menu" hidden>
    <sl-spinner style="font-size: 1rem;"></sl-spinner>
  </div>
</div>

<script>
(function () {
  // Initialisiert alle App-Switcher auf der Seite (robust statt früher über
  // document.currentScript.previousElementSibling, was bei Template-Umbauten
  // still gebrochen wäre).
  var switchers = document.querySelectorAll(".schalti-app-switcher");

  Array.prototype.forEach.call(switchers, function (root) {
    var trigger = root.querySelector(".schalti-app-switcher-trigger");
    var panel = root.querySelector(".schalti-app-switcher-panel");
    var registryUrl = root.getAttribute("data-registry");
    if (!trigger || !panel || !registryUrl) return;

    // Baut einen Menü-Eintrag sicher per DOM-API (kein innerHTML-String-Bau):
    // Name, Icon und Hint aus der Registry werden dadurch automatisch escaped.
    function buildItem(app, isCurrent) {
      var link = document.createElement("a");
      link.className = "schalti-app-item" + (isCurrent ? " ist-aktiv" : "");
      link.setAttribute("role", "menuitem");
      if (isCurrent) {
        link.setAttribute("aria-current", "page");
      } else {
        link.href = String(app.url || "#");
      }
      var icon = document.createElement("sl-icon");
      icon.setAttribute("name", String(app.icon || "circle"));
      link.appendChild(icon);
      var name = document.createElement("span");
      name.textContent = app.name || "";
      link.appendChild(name);
      if (isCurrent) {
        var check = document.createElement("sl-icon");
        check.setAttribute("name", "check2");
        check.className = "schalti-app-check";
        link.appendChild(check);
      } else if (app.hint) {
        var hint = document.createElement("span");
        hint.className = "schalti-app-hint";
        hint.textContent = app.hint;
        link.appendChild(hint);
      }
      return link;
    }

    function render(apps) {
      if (!Array.isArray(apps)) return;
      var here = window.location.origin;
      panel.textContent = "";
      apps.forEach(function (app) {
        var isCurrent = String(app.url || "").indexOf(here) === 0;
        panel.appendChild(buildItem(app, isCurrent));
      });
    }

    // Hinweis: sessionStorage-Cache ohne Invalidierung – Registry-Änderungen
    // wirken spätestens bei der nächsten Navigation; HTTP-Cache ist max-age=300.
    var cached = null;
    try { cached = sessionStorage.getItem("schalti_apps_registry"); } catch (e) { /* Privatmodus */ }
    if (cached) {
      try { render(JSON.parse(cached)); } catch (e) { /* ungültiger Cache -> neu laden */ }
    }
    fetch(registryUrl)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (apps) {
        try { sessionStorage.setItem("schalti_apps_registry", JSON.stringify(apps)); } catch (e) { /* Privatmodus */ }
        render(apps);
      })
      .catch(function () {
        if (!cached) { root.hidden = true; }
      });

    function openPanel(open) {
      panel.hidden = !open;
      trigger.setAttribute("aria-expanded", String(open));
      if (open) {
        var firstItem = panel.querySelector(".schalti-app-item");
        if (firstItem) firstItem.focus();
      }
    }

    function closePanel(refocusTrigger) {
      panel.hidden = true;
      trigger.setAttribute("aria-expanded", "false");
      if (refocusTrigger) trigger.focus();
    }

    trigger.addEventListener("click", function (e) {
      e.stopPropagation();
      if (panel.hidden) {
        openPanel(true);
      } else {
        closePanel(false);
      }
    });
    document.addEventListener("click", function () {
      if (!panel.hidden) closePanel(false);
    });
    // Tastatur: Escape schließt das Menü und gibt den Fokus zurück
    panel.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        e.stopPropagation();
        closePanel(true);
      }
    });
  });
})();
</script>
{% endif %}
