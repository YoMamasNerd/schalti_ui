[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schalti-ui"
version = "0.3.3"
description = "Schalti UI - Einheitliches Design-System und Shoelace Web Components für Fahrschule Schaltwerk"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jonas Eisele" }
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Bewusst exakt gepinnt: Das Linter-Verhalten (und damit die CI) muss
    # deterministisch sein. Ruffs Default-Regelset wurde 2026 massiv
    # erweitert - Updates gehören bewusst in einen Commit, nicht per Zufall
    # in den CI-Lauf.
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schalti_ui*"]

# Explizite Includes statt static/**/*: Editor-/Tooling-Metadaten von Shoelace
# (custom-elements.json, web-types.json, vscode.html-custom-data.json, react/,
# TypeScript-Deklarationen, events/) landen so nicht mehr im Wheel und sparen
# über 1 MB pro Installation/Deployment. Die von base.html referenzierten
# Assets (css/, htmx/, js/, shoelace/ Runtime-Dateien) sind vollständig abgedeckt.
[tool.setuptools.package-data]
schalti_ui = [
    "templates/**/*",
    "static/schalti_ui/css/*",
    "static/schalti_ui/htmx/*",
    "static/schalti_ui/js/*",
    "static/schalti_ui/shoelace/*.js",
    "static/schalti_ui/shoelace/assets/**/*",
    "static/schalti_ui/shoelace/chunks/**/*",
    "static/schalti_ui/shoelace/components/**/*",
    "static/schalti_ui/shoelace/internal/**/*",
    "static/schalti_ui/shoelace/styles/**/*",
    "static/schalti_ui/shoelace/themes/*.css",
    "static/schalti_ui/shoelace/translations/*.js",
    "static/schalti_ui/shoelace/utilities/*.js",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Bewusst explizit gepinnt statt des Ruff-Defaults: Das Default-Regelset
# wurde 2026 auf über 400 Regeln erweitert (u.a. flake8-pytest-style, refurb,
# Pylint-Serien) - ungepinnte CI-Läufe brechen damit unvorhersehbar bei
# Ruff-Updates. Klassisches, stabiles Set:
# E4/E7/E9 (pycodestyle-Kern) + F (Pyflakes) + B (Bugbear)
# + I (Import-Sorting) + UP (pyupgrade).
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
