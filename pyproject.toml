[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schalti-ui"
version = "0.1.0"
description = "Schalti UI - Einheitliches Design-System und Shoelace Web Components für Fahrschule Schaltwerk"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jonas Eisele" }
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "django>=4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["schalti_ui*"]

[tool.setuptools.package-data]
schalti_ui = [
    "static/**/*",
    "templates/**/*",
]
